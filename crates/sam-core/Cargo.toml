[package]
name = "sam-core"
description = "SAM engine — content model, resource resolution, plan loading. No windowing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `src/agent.rs` embeds `assets/sam-authoring.md` with `include_str!`. Keeping the
# body beside the crate (instead of reading `.agents/skills/...` from the repo)
# means a packaged or sparse checkout still compiles, and `cargo package` ships
# the file the crate compiles against.
include = ["src/**", "assets/**", "tests/**", "Cargo.toml"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
directories = { workspace = true }
notify = { workspace = true }
rusqlite = { workspace = true }
fsrs = { workspace = true }
