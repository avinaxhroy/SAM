name: Release on Changelog Update

on:
  push:
    branches: [ "main" ]
    paths:
      - 'CHANGELOG.md'
      - 'changelog.md'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force release even if tag already exists'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-changelog:
    name: Parse Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      notes: ${{ steps.parse.outputs.notes }}
      should_release: ${{ steps.check_tag.outputs.should_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Parse latest version and notes from CHANGELOG
        id: parse
        run: |
          node tools/extract-release-notes.mjs --github-output --out-notes notes.md
          echo "Notes extracted successfully."

      - name: Check if tag already exists
        id: check_tag
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists in git repository."
            if [ "$FORCE" = "true" ]; then
              echo "Force option enabled, proceeding with release."
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "Skipping release creation to prevent overwriting existing tag."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Tag $TAG does not exist yet. Proceeding with release."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  build-and-release:
    name: Build & Release (${{ matrix.platform }})
    needs: check-changelog
    if: needs.check-changelog.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os: 'macos'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            os: 'linux'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os: 'windows'
            target: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./

      - name: Install system dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install frontend dependencies
        run: pnpm -C ui install --frozen-lockfile

      - name: Build frontend
        run: pnpm -C ui build

      - name: Build CLI and Shell binaries
        run: cargo build --workspace --release

      - name: Populate CLI sidecar for Tauri bundling
        run: node tools/sidecar.mjs

      - name: Package CLI binary (Unix)
        if: matrix.os != 'windows'
        run: |
          mkdir -p dist-cli
          cp target/release/sam dist-cli/sam
          tar -czf "sam-${{ needs.check-changelog.outputs.tag }}-${{ matrix.target }}.tar.gz" -C dist-cli sam

      - name: Package CLI binary (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p dist-cli
          cp target/release/sam.exe dist-cli/sam.exe
          compress-archive -Path dist-cli/sam.exe -DestinationPath "sam-${{ needs.check-changelog.outputs.tag }}-${{ matrix.target }}.zip"

      - name: Build Tauri Desktop App & Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.check-changelog.outputs.tag }}
          releaseName: 'Release ${{ needs.check-changelog.outputs.tag }}'
          releaseBody: ${{ needs.check-changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false

      - name: Upload CLI release archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-changelog.outputs.tag }}
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            FILE="sam-${TAG}-${{ matrix.target }}.zip"
          else
            FILE="sam-${TAG}-${{ matrix.target }}.tar.gz"
          fi
          if [ -f "$FILE" ]; then
            echo "Uploading $FILE to GitHub Release $TAG..."
            gh release upload "$TAG" "$FILE" --clobber
          fi
